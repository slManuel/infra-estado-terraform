name: Planificar y aplicar infraestructura de estado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-estado-local
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: |
          terraform validate
          terraform test -no-color
          python3 scripts/test_bootstrap_plan.py
          python3 scripts/test_bootstrap_state.py

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: default
      TF_VAR_aws_account_id: "022907376152"
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Restaurar automáticamente el último estado efectivo
        run: |
          umask 077
          python3 scripts/bootstrap_state.py restore

      - name: Autenticarse mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::022907376152:role/prueba-devops-github-actions-estado
          aws-region: us-east-1
          allowed-account-ids: "022907376152"
          role-session-name: estado-${{ github.run_id }}

      - name: Impedir plan nuevo sobre recursos sin estado
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          bucket = "tfstate-prueba-cuscatlan-oct2026-jose-manuel-solis"
          path = Path("terraform.tfstate")
          selected = bool(os.environ.get("RESTORE_RUN_ID"))
          if selected != path.exists():
              raise SystemExit("La restauración seleccionada no tiene estado válido.")
          resources = []
          if path.exists():
              state = json.loads(path.read_text())
              if state.get("version") != 4 or not state.get("lineage"):
                  raise SystemExit("Formato de estado inválido.")
              resources = state.get("resources")
              if not isinstance(resources, list):
                  raise SystemExit("Estado sin lista de recursos.")

          def exists(args, missing):
              result = subprocess.run(
                  ["aws", *args, "--region", "us-east-1", "--no-cli-pager"],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  return True
              match = re.search(r"An error occurred \(([^)]+)\)", result.stderr)
              if match and match.group(1) == missing:
                  return False
              raise SystemExit("AWS no permitió comprobar recursos; ejecución detenida.")

          def recorded(kind, identifier):
              return any(
                  resource.get("type") == kind
                  and any(
                      instance.get("attributes", {}).get("id") == identifier
                      for instance in resource.get("instances", [])
                  )
                  for resource in resources
              )

          for bucket in (
              "tfstate-prueba-cuscatlan-oct2026-jose-manuel-solis",
              "tfstate-prueba-cuscatlan-oct2026-jose-manuel-solis-qa",
              "tfstate-prueba-cuscatlan-oct2026-jose-manuel-solis-production",
          ):
              if exists(
                  ["s3api", "get-bucket-versioning", "--bucket", bucket,
                   "--expected-bucket-owner", "022907376152"],
                  "NoSuchBucket"
              ) and not recorded("aws_s3_bucket", bucket):
                  raise SystemExit("Bucket existente sin registro en el estado restaurado.")

          for suffix in ("red", "jenkins-vault", "microservicio"):
              role = "prueba-devops-github-actions-" + suffix
              if exists(["iam", "get-role", "--role-name", role], "NoSuchEntity"):
                  if not recorded("aws_iam_role", role):
                      raise SystemExit("Rol existente sin registro en el estado restaurado.")
          print("Comprobaciones de estado completadas; no se imprimió su contenido.")
          PY

      - name: Inicializar y validar
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate

      - name: Planificar configuración completa
        shell: bash
        run: |
          umask 077
          set -o pipefail
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -out=bootstrap.tfplan 2>&1 | tee plan.log
          codes=("${PIPESTATUS[@]}")
          set -e
          echo "Terraform exit code: ${codes[0]}; tee exit code: ${codes[1]}"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          if [ "${codes[1]}" -ne 0 ]; then exit "${codes[1]}"; fi

      - name: Detener eliminaciones o reemplazos
        run: python3 scripts/check_bootstrap_plan.py bootstrap.tfplan

      - name: Preparar paquete de auditoría del plan
        run: |
          umask 077
          mkdir -p .review
          terraform show -no-color bootstrap.tfplan > .review/plan.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          folder = Path(".review")
          names = ["bootstrap.tfplan", ".terraform.lock.hcl"]
          has_state = Path("terraform.tfstate").exists()
          if has_state:
              names.append("terraform.tfstate")
          for name in names:
              shutil.copyfile(name, folder / name)
          names.append("plan.txt")
          files = {name: hashlib.sha256((folder / name).read_bytes()).hexdigest()
                   for name in names}
          manifest = {
              "operation": "plan", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "commit": os.environ["GITHUB_SHA"], "terraform": "1.15.9",
              "has_state": has_state, "files": files,
              "plan_sha256": files["bootstrap.tfplan"],
          }
          (folder / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Plan generado para apply automático del mismo archivo.\n\n")
              summary.write("Run: " + manifest["run_id"] + "\n\n")
              summary.write("Commit: " + manifest["commit"] + "\n\n")
              summary.write("SHA-256: " + manifest["plan_sha256"] + "\n")
          PY

      - name: Guardar plan para auditoría
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Comprobar main antes de aplicar
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$GITHUB_SHA"

      - name: Aplicar plan guardado
        id: apply
        shell: bash
        run: |
          umask 077
          set -o pipefail
          set +e
          terraform apply -no-color -input=false -lock-timeout=5m bootstrap.tfplan 2>&1 | tee apply.log
          codes=("${PIPESTATUS[@]}")
          set -e
          echo "Terraform exit code: ${codes[0]}; tee exit code: ${codes[1]}"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          if [ "${codes[1]}" -ne 0 ]; then exit "${codes[1]}"; fi

      - name: Resumir resultado y diagnóstico
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lines = []
          for name in ("plan.log", "apply.log"):
              path = Path(name)
              if not path.exists():
                  continue
              content = re.sub(r"\x1b\[[0-9;]*m", "", path.read_text())
              summaries = re.findall(
                  r"^(?:Plan: [^\n]+|Apply complete! Resources: [^\n]+)$",
                  content, re.MULTILINE
              )
              operations = re.findall(r"operation error ([A-Za-z0-9]+): ([A-Za-z0-9]+)", content)
              denied = re.findall(r"not authorized to perform: ([A-Za-z0-9:]+)", content)
              lines.extend(summaries)
              lines.extend("Error AWS: " + service + ":" + operation
                           for service, operation in sorted(set(operations)))
              lines.extend("Permiso denegado: " + action for action in sorted(set(denied)))
          for line in lines:
              print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n\n" + "\n\n".join(lines) + "\n")
          PY

      - name: Preparar respaldo íntegro del estado actual
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          umask 077
          python3 scripts/bootstrap_state.py backup

      - name: Conservar estado, también ante fallo parcial
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .state-backup/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Conservar logs de Terraform, también ante fallo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-diagnostico-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            plan.log
            apply.log
          if-no-files-found: ignore
          retention-days: 1
