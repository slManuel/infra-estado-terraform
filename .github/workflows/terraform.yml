name: Planificar y aprobar infraestructura de estado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "plan: generar propuesta; apply: aprobar exactamente el plan indicado"
        type: choice
        options: [plan, apply]
        default: plan
      plan_run_id:
        description: "ID del run del plan revisado; obligatorio para apply"
        type: string
        default: ""
      plan_commit:
        description: "Commit completo del plan revisado; obligatorio para apply"
        type: string
        default: ""
      plan_sha256:
        description: "SHA-256 del plan revisado; obligatorio para apply"
        type: string
        default: ""
      restore_run_id:
        description: "Run que contiene el estado a restaurar; vacío solo para el primer despliegue"
        type: string
        default: ""
      restore_run_attempt:
        description: "Intento del run que contiene el respaldo confirmado"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: terraform-estado-local
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: default
      TF_VAR_aws_account_id: "022907376152"
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
      OPERATION: ${{ inputs.operation || 'plan' }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_COMMIT: ${{ inputs.plan_commit }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      GH_TOKEN: ${{ github.token }}
      APPROVER_ID: ${{ github.actor_id }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
      RESTORE_RUN_ATTEMPT: ${{ inputs.restore_run_attempt }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Impedir rerun con artefactos ambiguos
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          case "$OPERATION" in plan|apply) ;; *) exit 1 ;; esac

      - name: Validar aprobación manual y vigencia del plan
        if: env.OPERATION == 'apply'
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          e = os.environ
          if (e["GITHUB_EVENT_NAME"] != "workflow_dispatch"
              or e["GITHUB_REF"] != "refs/heads/main"
              or e["APPROVER_ID"] != "65916668"
              or e["TRIGGERING_ACTOR"] != "slManuel"
              or e["GITHUB_RUN_ATTEMPT"] != "1"):
              raise SystemExit("Apply requiere aprobación manual de slManuel en main, sin rerun.")
          for key, pattern in (
              ("PLAN_RUN_ID", r"[1-9][0-9]*"),
              ("PLAN_COMMIT", r"[0-9a-f]{40}"),
              ("PLAN_SHA256", r"[0-9a-f]{64}"),
          ):
              if not re.fullmatch(pattern, e[key]):
                  raise SystemExit("Identificación del plan incompleta o inválida.")
          repo = "repos/" + e["GITHUB_REPOSITORY"]
          current = api(repo + "/actions/runs/" + e["GITHUB_RUN_ID"])
          source = api(repo + "/actions/runs/" + e["PLAN_RUN_ID"])
          if (source["workflow_id"] != current["workflow_id"]
              or source["head_branch"] != "main"
              or source["head_sha"] != e["PLAN_COMMIT"]
              or source["event"] not in ("push", "workflow_dispatch")
              or source["conclusion"] != "success"
              or source["run_attempt"] != 1):
              raise SystemExit("El run fuente no es un plan válido de este workflow en main.")
          head = api(repo + "/git/ref/heads/main")["object"]["sha"]
          if head != e["PLAN_COMMIT"] or e["GITHUB_SHA"] != head:
              raise SystemExit("Main cambió: se requiere un plan nuevo.")
          created = dt.datetime.fromisoformat(source["created_at"].replace("Z", "+00:00"))
          age = dt.datetime.now(dt.timezone.utc) - created
          if not dt.timedelta(0) <= age <= dt.timedelta(hours=24):
              raise SystemExit("Plan caducado: se requiere un plan nuevo.")
          # Serializados por la concurrencia del workflow. Rechazar incluso
          # intentos fallidos de apply posteriores al plan elegido.
          page = 1
          while True:
              runs = api(repo + "/actions/workflows/" + str(current["workflow_id"])
                         + "/runs?per_page=100&page=" + str(page))["workflow_runs"]
              for run in runs:
                  if (str(run["id"]) == e["GITHUB_RUN_ID"]
                      or run["created_at"] < source["created_at"]):
                      continue
                  job_page = 1
                  while True:
                      jobs = api(repo + "/actions/runs/" + str(run["id"])
                                 + "/jobs?filter=all&per_page=100&page=" + str(job_page))["jobs"]
                      for job in jobs:
                          for step in job.get("steps", []):
                              if (step["name"] == "Validar aprobación manual y vigencia del plan"
                                  and step["status"] in ("in_progress", "completed")
                                  and step.get("conclusion") != "skipped"):
                                  raise SystemExit("Hubo otro intento de apply; generar un plan nuevo con el último estado.")
                      if len(jobs) < 100:
                          break
                      job_page += 1
              if len(runs) < 100 or all(r["created_at"] < source["created_at"] for r in runs):
                  break
              page += 1
          PY

      - name: Descargar paquete del plan aprobado
        if: env.OPERATION == 'apply'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}-1
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: .review

      - name: Verificar paquete y restaurar estado exacto
        if: env.OPERATION == 'apply'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          folder = Path(".review")
          manifest = json.loads((folder / "manifest.json").read_text())
          e = os.environ
          if (manifest.get("operation") != "plan"
              or manifest.get("run_id") != e["PLAN_RUN_ID"]
              or manifest.get("commit") != e["PLAN_COMMIT"]
              or manifest.get("plan_sha256") != e["PLAN_SHA256"]
              or manifest.get("terraform") != "1.15.9"):
              raise SystemExit("El paquete no corresponde a la aprobación.")
          expected = {"bootstrap.tfplan", "plan.txt", ".terraform.lock.hcl"}
          if manifest.get("has_state") is True:
              expected.add("terraform.tfstate")
          elif manifest.get("has_state") is not False:
              raise SystemExit("Manifiesto de estado inválido.")
          if set(manifest["files"]) != expected:
              raise SystemExit("Inventario del paquete inválido.")
          for name, digest in manifest["files"].items():
              if hashlib.sha256((folder / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit("Integridad del paquete inválida.")
          if manifest["files"]["bootstrap.tfplan"] != e["PLAN_SHA256"]:
              raise SystemExit("El plan binario difiere del aprobado.")
          shutil.copyfile(folder / ".terraform.lock.hcl", ".terraform.lock.hcl")
          if manifest["has_state"]:
              shutil.copyfile(folder / "terraform.tfstate", "terraform.tfstate")
          elif Path("terraform.tfstate").exists():
              raise SystemExit("Estado inesperado en una primera ejecución.")
          PY

      - name: Exigir estado del último apply ejecutado
        if: env.OPERATION == 'plan'
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          e = os.environ
          repo = "repos/" + e["GITHUB_REPOSITORY"]
          current = api(repo + "/actions/runs/" + e["GITHUB_RUN_ID"])
          latest = None
          page = 1
          while True:
              runs = api(repo + "/actions/workflows/" + str(current["workflow_id"])
                         + "/runs?per_page=100&page=" + str(page))["workflow_runs"]
              for run in runs:
                  if str(run["id"]) == e["GITHUB_RUN_ID"]:
                      continue
                  job_page = 1
                  while True:
                      jobs = api(repo + "/actions/runs/" + str(run["id"])
                                 + "/jobs?filter=all&per_page=100&page=" + str(job_page))["jobs"]
                      for job in jobs:
                          for step in job.get("steps", []):
                              if (step["name"] == "Aplicar plan aprobado"
                                  and step["status"] in ("in_progress", "completed")
                                  and step.get("conclusion") != "skipped"):
                                  timestamp = step.get("started_at")
                                  if not timestamp:
                                      raise SystemExit("No se puede determinar el último apply.")
                                  candidate = (timestamp, str(run["id"]))
                                  if latest is None or candidate > latest:
                                      latest = candidate
                      if len(jobs) < 100:
                          break
                      job_page += 1
              if len(runs) < 100:
                  break
              page += 1
          selected = e.get("RESTORE_RUN_ID", "")
          if latest is None:
              if selected:
                  raise SystemExit("Sin apply previo: no corresponde seleccionar un respaldo.")
          elif selected != latest[1] or e.get("RESTORE_RUN_ATTEMPT") != "1":
              raise SystemExit("Restaurar el respaldo del último apply: run " + latest[1] + ", intento 1.")
          PY

      - name: Restaurar respaldo elegido explícitamente
        if: env.OPERATION == 'plan' && github.event_name == 'workflow_dispatch' && inputs.restore_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-state-${{ inputs.restore_run_id }}-${{ inputs.restore_run_attempt }}
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Autenticarse mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::022907376152:role/prueba-devops-github-actions-estado
          aws-region: us-east-1
          allowed-account-ids: "022907376152"
          role-session-name: estado-${{ github.run_id }}

      - name: Impedir plan nuevo sobre recursos sin estado
        if: env.OPERATION == 'plan'
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          bucket = "tfstate-prueba-cuscatlan-oct2026-jose-manuel-solis"
          path = Path("terraform.tfstate")
          selected = bool(os.environ.get("RESTORE_RUN_ID"))
          if selected != path.exists():
              raise SystemExit("La restauración seleccionada no tiene estado válido.")
          resources = []
          if path.exists():
              state = json.loads(path.read_text())
              if state.get("version") != 4 or not state.get("lineage"):
                  raise SystemExit("Formato de estado inválido.")
              resources = state.get("resources")
              if not isinstance(resources, list):
                  raise SystemExit("Estado sin lista de recursos.")

          def exists(args, missing):
              result = subprocess.run(
                  ["aws", *args, "--region", "us-east-1", "--no-cli-pager"],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  return True
              match = re.search(r"An error occurred \(([^)]+)\)", result.stderr)
              if match and match.group(1) == missing:
                  return False
              raise SystemExit("AWS no permitió comprobar recursos; ejecución detenida.")

          def recorded(kind, identifier):
              return any(
                  resource.get("type") == kind
                  and any(
                      instance.get("attributes", {}).get("id") == identifier
                      for instance in resource.get("instances", [])
                  )
                  for resource in resources
              )

          if exists(
              ["s3api", "get-bucket-versioning", "--bucket", bucket,
               "--expected-bucket-owner", "022907376152"],
              "NoSuchBucket"
          ) and not recorded("aws_s3_bucket", bucket):
              raise SystemExit("Bucket existente sin registro en el estado restaurado.")

          for suffix in ("red", "jenkins-vault", "microservicio"):
              role = "prueba-devops-github-actions-" + suffix
              if exists(["iam", "get-role", "--role-name", role], "NoSuchEntity"):
                  if not recorded("aws_iam_role", role):
                      raise SystemExit("Rol existente sin registro en el estado restaurado.")
          print("Comprobaciones de estado completadas; no se imprimió su contenido.")
          PY

      - name: Inicializar y validar
        run: |
          if [ "$OPERATION" = "apply" ]; then
            terraform init -input=false -lockfile=readonly
          else
            terraform init -input=false
          fi
          terraform validate

      - name: Planificar configuración completa
        if: env.OPERATION == 'plan'
        run: |
          umask 077
          if ! terraform plan -input=false -lock-timeout=5m -out=bootstrap.tfplan >plan.log 2>&1; then
            echo "Plan fallido; no se publica su log potencialmente sensible."
            exit 1
          fi

      - name: Detener eliminaciones o reemplazos
        if: env.OPERATION == 'plan'
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          plan = json.loads(subprocess.check_output(
              ["terraform", "show", "-json", "bootstrap.tfplan"], text=True
          ))
          if any(
              "delete" in change["change"]["actions"]
              for change in plan.get("resource_changes", [])
          ):
              raise SystemExit("Plan destructivo: requiere revisión separada.")
          PY

      - name: Preparar paquete revisable del plan
        if: env.OPERATION == 'plan'
        run: |
          umask 077
          mkdir -p .review
          terraform show -no-color bootstrap.tfplan > .review/plan.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          folder = Path(".review")
          names = ["bootstrap.tfplan", ".terraform.lock.hcl"]
          has_state = Path("terraform.tfstate").exists()
          if has_state:
              names.append("terraform.tfstate")
          for name in names:
              shutil.copyfile(name, folder / name)
          names.append("plan.txt")
          files = {name: hashlib.sha256((folder / name).read_bytes()).hexdigest()
                   for name in names}
          manifest = {
              "operation": "plan", "run_id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"], "terraform": "1.15.9",
              "has_state": has_state, "files": files,
              "plan_sha256": files["bootstrap.tfplan"],
          }
          (folder / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Revisar plan.txt dentro del artefacto privado antes de aprobar.\n\n")
              summary.write("Run: " + manifest["run_id"] + "\n\n")
              summary.write("Commit: " + manifest["commit"] + "\n\n")
              summary.write("SHA-256: " + manifest["plan_sha256"] + "\n")
          PY

      - name: Guardar plan para revisión humana
        if: env.OPERATION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_id }}-1
          path: .review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Comprobar main antes de aplicar
        if: env.OPERATION == 'apply'
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$PLAN_COMMIT"

      - name: Aplicar plan aprobado
        if: env.OPERATION == 'apply'
        run: |
          umask 077
          if ! terraform apply -input=false -lock-timeout=5m .review/bootstrap.tfplan >apply.log 2>&1; then
            echo "Apply fallido; revisar respaldo de estado, sin publicar el log sensible."
            exit 1
          fi

      - name: Conservar estado, también ante fallo parcial
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform.tfstate
            terraform.tfstate.backup
            errored.tfstate
          if-no-files-found: ignore
          retention-days: 14
